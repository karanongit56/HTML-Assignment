<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>TravelEase</title>

    <style>
        /* Reset default spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling */
        body {
            font-family: Arial, sans-serif;
            color: #12203a;
        }

        /* ---------- MOBILE FIRST (default) ---------- */

        /* Navigation bar */
        nav {
            display: flex;
            flex-direction: column;
            /* Stacked on phone */
            align-items: center;
            gap: 8px;
            padding: 14px;
            background: #12203a;
            color: white;
        }

        /* Navigation links */
        nav a {
            color: white;
            margin: 0 8px;
            text-decoration: none;
        }

        /* Hero section */
        .hero {
            padding: 40px 16px;
            text-align: center;
            background: #2f5bea;
            color: white;
        }

        /* Hero heading */
        .hero h1 {
            font-size: 1.6rem;
        }

        /* Hero image */
        .hero img {
            max-width: 100%;
            height: auto;
            margin-top: 16px;
            border-radius: 12px;
        }

        /* Features section */
        .features {
            display: grid;
            grid-template-columns: 1fr;
            /* 1 column on phone */
            gap: 16px;
            padding: 20px;
        }

        /* Feature boxes */
        .box {
            background: #eef2ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        /* Footer */
        footer {
            background: #12203a;
            color: white;
            text-align: center;
            padding: 16px;
        }

        /* ---------- TABLET (768px and wider) ---------- */

        @media (min-width: 768px) {

            nav {
                flex-direction: row;
                justify-content: space-between;
                padding: 14px 32px;
            }

            .hero h1 {
                font-size: 2.4rem;
            }

            .features {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ---------- LAPTOP (1024px and wider) ---------- */

        @media (min-width: 1024px) {

            .features {
                grid-template-columns: repeat(3, 1fr);
                padding: 40px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation bar -->
    <nav>

        <h2>TravelEase</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">Trips</a>
            <a href="#">Contact</a>
        </div>

    </nav>

    <!-- Hero section -->
    <section class="hero">

        <h1>Plan your next trip in minutes</h1>

        <p>Simple, cheap and fun travel plans.</p>

        <img
            src="mountain.jpg"
            alt="Mountain trip banner"
            width="600"
        >

    </section>

    <!-- Features section -->
    <section class="features">

        <!-- Feature 1 -->
        <div class="box">
            <h3>Easy Booking</h3>
            <p>Book in 3 clicks.</p>
        </div>

        <!-- Feature 2 -->
        <div class="box">
            <h3>Best Prices</h3>
            <p>We compare for you.</p>
        </div>

        <!-- Feature 3 -->
        <div class="box">
            <h3>24x7 Help</h3>
            <p>We are always online.</p>
        </div>

    </section>

    <!-- Footer -->
    <footer>
        Made by a first year student
    </footer>

</body>

</html>
